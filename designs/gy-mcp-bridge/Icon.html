<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GY Design MCP Bridge — Icon</title>
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 主色渐变：蓝 → 绿（沿用插件面板 accent / ok 两色） -->
      <linearGradient id="markGrad" x1="150" y1="0" x2="874" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5b8cff" />
        <stop offset="0.52" stop-color="#7ea6ff" />
        <stop offset="1" stop-color="#3ecf8e" />
      </linearGradient>

      <!-- 底板：上浅下深 -->
      <linearGradient id="tileGrad" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#23252d" />
        <stop offset="0.52" stop-color="#14151a" />
        <stop offset="1" stop-color="#08090c" />
      </linearGradient>

      <linearGradient id="topSheen" x1="512" y1="0" x2="512" y2="560" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
        <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>

      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#5b8cff" stop-opacity="0.42" />
        <stop offset="0.5" stop-color="#5b8cff" stop-opacity="0.12" />
        <stop offset="1" stop-color="#5b8cff" stop-opacity="0" />
      </radialGradient>

      <!-- 桥体辉光：让结构在深色底上“亮”起来 -->
      <filter id="beamGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="16" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <clipPath id="tileClip">
        <rect x="0" y="0" width="1024" height="1024" rx="232" />
      </clipPath>
    </defs>

    <g clip-path="url(#tileClip)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#tileGrad)" />
      <rect x="0" y="0" width="1024" height="560" fill="url(#topSheen)" />
      <ellipse cx="512" cy="520" rx="380" ry="300" fill="url(#glow)" />

      <!-- 桥体：桥面 + 双桥墩 + 主缆弧 + 塔顶节点 -->
      <g filter="url(#beamGlow)">
        <!-- 桥面（引桥向两侧伸出） -->
        <line x1="150" y1="684" x2="874" y2="684"
              stroke="url(#markGrad)" stroke-width="26" stroke-linecap="round" opacity="0.95" />

        <!-- 左桥墩：从塔顶竖直落到桥面 -->
        <line x1="336" y1="424" x2="336" y2="684"
              stroke="url(#markGrad)" stroke-width="26" stroke-linecap="round" />

        <!-- 右桥墩 -->
        <line x1="688" y1="424" x2="688" y2="684"
              stroke="url(#markGrad)" stroke-width="26" stroke-linecap="round" />

        <!-- 主缆：两端落在塔顶 -->
        <path d="M336 424 C 430 314, 594 314, 688 424"
              fill="none" stroke="url(#markGrad)" stroke-width="26" stroke-linecap="round" />

        <!-- 塔顶连接节点 -->
        <circle cx="336" cy="424" r="44" fill="url(#markGrad)" />
        <circle cx="688" cy="424" r="44" fill="url(#markGrad)" />
      </g>

      <rect x="1" y="1" width="1022" height="1022" rx="231" fill="none"
            stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" />
    </g>
  </svg>
</body>
</html>
